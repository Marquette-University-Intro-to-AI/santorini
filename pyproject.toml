[build-system]
requires = ["setuptools>=64"]
backend = "setuptools"

[project]
name = "santorini-harness-api"
version = "0.1.0"
description = "Santorini game engine harness API"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "data_structures",
    "santorini_engine",
    "santorini_tournament_harness",
    "santorini",
    "student_bot_template",
]

[tool.pyright]
# The analyzer may run on an interpreter without the package installed (e.g. the
# global python, which also cannot resolve dynamic editable .pth files on 3.11),
# so src/ must be on the analysis path regardless of environment.
extraPaths = ["src"]
# The bot contract mandates these parameter names; the starter bot does not use all of them.
perFileIgnoreRules = { "src/student_bot_template.py" = ["reportUnusedParameter"] }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "EXE"]

[tool.ruff.lint.isort]
known-first-party = [
    "data_structures",
    "santorini_engine",
    "santorini_tournament_harness",
    "student_bot_template",
]
